app = "meili-wp-shop"
primary_region = "cdg"

[build]
  build-target = "fly"
  [build.args]
    SITE = "shop"
    WORDPRESS_VERSION = "7.1.2"
    WOOCOMMERCE_VERSION = "11.1.2"

[env]
  SITE = "shop"
  DB_NAME = "shop"
  MEILISEARCH_INDEX_PREFIX = "shop"
  WP_ENVIRONMENT_TYPE = "production"
  DB_USER = "wp"
  DB_HOST = "127.0.0.1"

[[mounts]]
  source = "data"
  destination = "/data"
  initial_size = "3gb"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "900s"
    interval = "30s"
    method = "GET"
    path = "/wp-login.php"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
