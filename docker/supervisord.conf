[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:mariadb]
command=/usr/sbin/mariadbd --user=mysql --datadir=/data/mysql --bind-address=127.0.0.1
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:site]
command=/opt/demo/bin/demo-entrypoint.sh apache2-foreground
priority=20
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
