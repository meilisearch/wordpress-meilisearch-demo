# Public (Fly) image only: no login page and no admin over HTTP. Administer the sites with WP-CLI
# (fly ssh console). admin-ajax.php stays reachable for front-end AJAX.
<LocationMatch "^/(wp-login|wp-signup|wp-activate|xmlrpc)\.php">
	Require all denied
</LocationMatch>
<LocationMatch "^/wp-admin(?!/admin-ajax\.php$)(/|$)">
	Require all denied
</LocationMatch>
